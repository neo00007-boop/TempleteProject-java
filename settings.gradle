pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // 仍由根 build.gradle 的 allprojects.repositories 解析依赖
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
}
rootProject.name = "TempleteProject-java"
//壳工程
include ':app'
include ':demo'
//业务模块：xxx 是实现，xxx_api 放对外服务接口（没有服务接口的模块不建 api）；路由路径统一在 lib_router 的 RoutePath
include ':module_square_api'
include ':module_square'
include ':module_player'
include ':module_login'
//基础组件，自下而上：startup → network/router/res/greendao/room/view → base
include ':library'
include ':library:lib_startup'
include ':library:lib_router'
include ':library:lib_network'
include ':library:lib_res'
include ':library:lib_base'
include ':library:lib_greendao'
include ':library:lib_room'
include ':library:lib_view'
