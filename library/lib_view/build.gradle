//常用view控件汇总
dependencies {
    //颜色、x/y 适配尺寸在 lib_res
    api project(':library:lib_res')
    //androidx / material（版本见根 config.gradle）
    api "com.google.android.material:material:${config.dependencies.material_version}"
    api "androidx.appcompat:appcompat:${config.dependencies.appcompat_version}"
    api "androidx.activity:activity:${config.dependencies.activity_version}"
    api "androidx.fragment:fragment:${config.dependencies.fragment_version}"
    api "androidx.core:core:${config.dependencies.androidx_core_version}"
    api "androidx.cardview:cardview:${config.dependencies.cardview_version}"
    api "androidx.recyclerview:recyclerview:${config.dependencies.recyclerview_version}"
    api "androidx.constraintlayout:constraintlayout:${config.dependencies.constraintlayout_version}"
    api "androidx.viewpager2:viewpager2:${config.dependencies.viewpager2_version}"
    //Tab 控件（com.flyco.tablayout，源自 FlycoTabLayout）用
    api "androidx.viewpager:viewpager:${config.dependencies.viewpager_version}"
    //api "com.nex3z:flow-layout:${config.dependencies.flow_layout_version}"
    //垂直刷新
    api "io.github.scwang90:refresh-layout-kernel:${config.dependencies.smart_refresh_version}"      //核心必须依赖
    api "io.github.scwang90:refresh-header-classics:${config.dependencies.smart_refresh_version}"    //经典刷新头
    api "io.github.scwang90:refresh-footer-classics:${config.dependencies.smart_refresh_version}"    //经典加载
    api "io.github.scwang90:refresh-header-material:${config.dependencies.smart_refresh_version}"
}

