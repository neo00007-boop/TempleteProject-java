plugins {
    id 'com.android.library'
}
def config = rootProject.ext
android {
    namespace 'com.greendao.db'
    compileSdkVersion config.android.compileSdkVersion
//    buildToolsVersion config.android.buildToolsVersion

    defaultConfig {
        minSdkVersion config.android.minSdkVersion
        targetSdkVersion config.android.targetSdkVersion
        versionCode config.android.versionCode
        versionName config.android.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // greendao-gradle-plugin 3.3.0 不兼容 Gradle 9（IncrementalTaskInputs 已移除）。
    // Dao 源码已落在 src/main/java，改表时可用旧环境/独立生成器再提交生成代码。
}

dependencies {

//    implementation 'androidx.appcompat:appcompat:1.1.0'
//    implementation 'com.google.android.material:material:1.1.0'
    testImplementation "junit:junit:${config.dependencies.junit_version}"
    androidTestImplementation "androidx.test.ext:junit:${config.dependencies.ext_junit_version}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${config.dependencies.espresso_core_version}"

    //ModuleInitializer
    api project(':library:lib_startup')
    //db
    api "org.greenrobot:greendao:${config.dependencies.greendao_version}"
    api "com.squareup.retrofit2:converter-gson:${config.dependencies.retrofit_version}"
    api "com.github.getActivity:GsonFactory:${config.dependencies.gson_factory_version}"
}
