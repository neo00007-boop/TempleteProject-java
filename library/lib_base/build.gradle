plugins {
    id 'com.android.library'
}
def config = rootProject.ext
// UI 基础层：Activity/Fragment/Dialog/Pop/Adapter 基类和 UI 工具，业务模块都依赖它
android {
    namespace 'com.lib.base'
    compileSdkVersion config.android.compileSdkVersion

    defaultConfig {
        minSdkVersion config.android.minSdkVersion
        targetSdkVersion config.android.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //本库自带的混淆规则，app 打包混淆时自动带上
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        disable 'GoogleAppIndexingWarning'
        disable 'MissingTranslation'
        checkReleaseBuilds false
        abortOnError false
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }
}
repositories {
    flatDir {
        dirs 'libs'
    }
}
dependencies {
    api project(':library:lib_router')
    //网络层，带出 retrofit、okhttp、rxjava3
    api project(':library:lib_network')
    api project(':library:lib_greendao')
    api project(':library:lib_room')
    //lib_view 已 api 依赖 lib_res，公共资源随它带出
    api project(':library:lib_view')
    api "com.github.getActivity:XXPermissions:${config.dependencies.xxpermissions_version}"
    api "com.github.getActivity:ToastUtils:${config.dependencies.toastutils_version}"
    api "com.jakewharton.rxbinding4:rxbinding:${config.dependencies.rxbinding_version}"

    api "com.trello.rxlifecycle4:rxlifecycle:${config.dependencies.rxlifecycle_version}"
    api "com.trello.rxlifecycle4:rxlifecycle-android:${config.dependencies.rxlifecycle_version}"
    api "com.trello.rxlifecycle4:rxlifecycle-components:${config.dependencies.rxlifecycle_version}"

    //title bar
    api "com.geyifeng.immersionbar:immersionbar:${config.dependencies.immersionbar_version}"
    //leakcanary
    debugApi "com.squareup.leakcanary:leakcanary-android:${config.dependencies.leakcanary_version}"
    annotationProcessor "com.github.bumptech.glide:compiler:${config.dependencies.glide_version}"
    // PictureSelector 基础 (必须)
    api "io.github.lucksiege:pictureselector:${config.dependencies.pictureselector_version}"
    // 图片压缩 (按需引入)
    implementation "io.github.lucksiege:compress:${config.dependencies.pictureselector_version}"
    // 图片裁剪 (按需引入)
    implementation "io.github.lucksiege:ucrop:${config.dependencies.pictureselector_version}"
    // 自定义相机 (按需引入)
    api "io.github.lucksiege:camerax:${config.dependencies.pictureselector_version}"
    //七牛
    implementation "com.qiniu:qiniu-android-sdk:${config.dependencies.qiniu_version}"
    implementation "androidx.lifecycle:lifecycle-runtime:${config.dependencies.androidx_lifecycle_version}"
    //glide
    api "com.github.bumptech.glide:glide:${config.dependencies.glide_version}"

    // 帖子音频 PostAudioView
    api "androidx.media3:media3-exoplayer:${config.dependencies.media3_version}"

    //********************************************以下是view依赖**************************************************
    // 动画解析库：https://github.com/airbnb/lottie-android
    api "com.airbnb.android:lottie:${config.dependencies.lottie_version}"
    //banner
    api "io.github.youth5201314:banner:${config.dependencies.banner_version}"
    //AndRatingBar
    api "com.github.wdsqjq:AndRatingBar:${config.dependencies.andratingbar_version}"
    api "jp.co.cyberagent.android:gpuimage:${config.dependencies.gpuimage_version}"
    //drag
    api "com.github.open-android:DragFooterView:${config.dependencies.drag_footer_version}"
    //flex
    api "com.google.android.flexbox:flexbox:${config.dependencies.flexbox_version}"
    // BRVAH 3.x；4.x API 大改暂不跟
    api "io.github.cymchad:BaseRecyclerViewAdapterHelper:${config.dependencies.brvah_version}"
    // skeleton / shimmer
    api "com.github.skydoves:androidveil:${config.dependencies.androidveil_version}"
    api "com.kunminx.arch:unpeek-livedata:${config.dependencies.unpeek_livedata_version}"

    testImplementation "junit:junit:${config.dependencies.junit_version}"
    androidTestImplementation "androidx.test.ext:junit:${config.dependencies.ext_junit_version}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${config.dependencies.espresso_core_version}"
}
