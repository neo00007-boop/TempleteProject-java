plugins {
    id 'com.android.library'
}
def config = rootProject.ext
// UI 基础层：Activity/Fragment/Dialog/Pop/Adapter 基类和 UI 工具，业务模块都依赖它
android {
    namespace 'com.lib.base'
    compileSdkVersion config.android.compileSdkVersion

    defaultConfig {
        minSdkVersion config.android.minSdkVersion
        targetSdkVersion config.android.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //本库自带的混淆规则，app 打包混淆时自动带上
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        disable 'GoogleAppIndexingWarning'
        disable 'MissingTranslation'
        checkReleaseBuilds false
        abortOnError false
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}
repositories {
    flatDir {
        dirs 'libs'
    }
}
dependencies {
    api project(':library:lib_router')
    //网络层，带出 retrofit、okhttp、rxjava3
    api project(':library:lib_network')
    api project(':library:lib_db')
    //lib_view 已 api 依赖 lib_res，公共资源随它带出
    api project(':library:lib_view')
    api 'com.github.getActivity:XXPermissions:13.5'
    implementation "com.github.getActivity:ToastUtils:${config.dependencies.toastutils_version}"
    implementation "com.jakewharton.rxbinding4:rxbinding:${config.dependencies.rxbinding_version}"

    api 'com.trello.rxlifecycle4:rxlifecycle:4.0.2'
    api 'com.trello.rxlifecycle4:rxlifecycle-android:4.0.2'
    api 'com.trello.rxlifecycle4:rxlifecycle-components:4.0.2'

    //title bar
    implementation "com.geyifeng.immersionbar:immersionbar:${config.dependencies.immersionbar_version}"
    //leakcanary
    //noinspection GradleDependency
    debugApi "com.squareup.leakcanary:leakcanary-android:${config.dependencies.leakcanary_version}"
    annotationProcessor "com.github.bumptech.glide:compiler:${config.dependencies.glide_version}"
    // PictureSelector 基础 (必须)
    api "io.github.lucksiege:pictureselector:${config.dependencies.pictureselector_version}"
    // 图片压缩 (按需引入)
    implementation "io.github.lucksiege:compress:${config.dependencies.pictureselector_version}"
    // 图片裁剪 (按需引入)
    implementation "io.github.lucksiege:ucrop:${config.dependencies.pictureselector_version}"
    // 自定义相机 (按需引入)
    api "io.github.lucksiege:camerax:${config.dependencies.pictureselector_version}"
    //七牛
    //noinspection GradleDependency
    implementation "com.qiniu:qiniu-android-sdk:${config.dependencies.qiniu_version}"
    implementation "androidx.lifecycle:lifecycle-runtime:${config.dependencies.androidx_lifecycle_version}"
    //glide
    api "com.github.bumptech.glide:glide:${config.dependencies.glide_version}"

    //********************************************以下是view依赖**************************************************
    // 动画解析库：https://github.com/airbnb/lottie-android
    implementation 'com.airbnb.android:lottie:4.1.0'
    //banner
    implementation 'io.github.youth5201314:banner:2.2.2'
    //AndRatingBar
    api 'com.github.wdsqjq:AndRatingBar:1.0.6'
    api "jp.co.cyberagent.android:gpuimage:2.1.0"
    //drag
    api 'com.github.open-android:DragFooterView:0.1.0'
    //flex
    api 'com.google.android.flexbox:flexbox:3.0.0'
    // 3.0.15+ 依赖 kotlin-stdlib 2.2.x，与工程 Kotlin 1.8.22 不兼容；3.0.14 API 同属 3.x
    api "io.github.cymchad:BaseRecyclerViewAdapterHelper:3.0.14"
    // skeleton / shimmer
    api 'com.github.skydoves:androidveil:1.1.3'
    api "com.kunminx.arch:unpeek-livedata:7.8.0"

    testImplementation "junit:junit:${config.dependencies.junit_version}"
    androidTestImplementation "androidx.test.ext:junit:${config.dependencies.ext_junit_version}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${config.dependencies.espresso_core_version}"
}
