// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: "config.gradle"
buildscript {
    ext {
        // AGP 9.2 内置 Kotlin 依赖 KGP ≥ 2.2.10；关闭 builtInKotlin 时仍需显式声明
        kotlin_version = '2.2.10'
    }
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }
    dependencies {
        // AGP 9.3.x ↔ Gradle 9.5.0（修复 9.2 R8 对 androidx.core 合成 lambda 的 NPE）
        classpath 'com.android.tools.build:gradle:9.3.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // greendao-gradle-plugin 与 Gradle 9 不兼容，已改为手写/预生成 Dao
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
    }
    // KGP 2.2 默认 jvmTarget=17，与现有 Java 1.8 对齐
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = '1.8'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}